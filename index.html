<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXORA AI</title>
<style>
:root{--bg:#07070d;--g:#14141f;--g2:#1d1d2b;--v:#8b5cf6;--b:#38bdf8;--o:#fb923c;--t:#f1f1f7;--m:#8d8da6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 85% -10%,#2a1a55,transparent 45%),var(--bg);color:var(--t);font:15px/1.45 system-ui,sans-serif;padding-left:190px}
nav{position:fixed;left:0;top:0;bottom:0;width:190px;background:#0b0b14;border-right:1px solid #ffffff14;padding:14px 10px;display:flex;flex-direction:column;gap:4px;z-index:5}
.lg{font-size:20px;padding:6px 10px 14px;letter-spacing:3px}.lg span{color:var(--v)}
nav a{padding:10px;border-radius:10px;cursor:pointer;color:var(--m);display:flex;gap:10px;align-items:center}
nav a.on{background:linear-gradient(90deg,#8b5cf633,#38bdf822);color:#fff}nav i{font-style:normal}
main{padding:20px;max-width:1100px}
h2{margin:0 0 14px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{background:var(--g);border:1px solid #ffffff12;border-radius:14px;padding:14px;margin-bottom:10px}
.k{font-size:28px;font-weight:700;background:linear-gradient(90deg,var(--v),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.s{color:var(--m);font-size:12px}
.w{color:var(--o);font-size:12px}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--g2);border:1px solid #ffffff1f;border-radius:10px;padding:8px 12px}
button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--b)}
button.p{background:linear-gradient(90deg,var(--v),#6366f1);border:0}button.d{border-color:#f8717180}
textarea,input{width:100%;margin:4px 0}textarea{min-height:90px}input[type=file]{display:none}
.ab{display:inline-flex;gap:6px;align-items:center;margin:3px;text-align:left}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.bd{font-size:11px;padding:2px 8px;border-radius:99px;background:#8b5cf633}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--b));margin-right:8px;font-weight:700}
.md{position:fixed;inset:0;background:#000b;z-index:9;display:flex;align-items:flex-end;justify-content:center}.md[hidden]{display:none}
.mb{background:var(--g);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
#tt{position:fixed;top:12px;right:12px;background:var(--o);color:#000;padding:8px 14px;border-radius:10px;display:none;z-index:10}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,monospace;margin:4px 0;color:#c9c9dd}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media(max-width:760px){body{padding:0 0 70px}
nav{top:auto;width:auto;right:0;height:62px;flex-direction:row;overflow-x:auto;padding:6px 6px max(6px,env(safe-area-inset-bottom));border-top:1px solid #ffffff14;border-right:0}
.lg{display:none}nav a{flex-direction:column;gap:0;font-size:11px;padding:4px 10px;flex:none}
main{padding:14px;padding-top:max(14px,env(safe-area-inset-top))}}
.hqt,.hqt2{position:absolute;left:8px;right:8px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}.hqt{top:8px}.hqt2{top:48px;align-items:center}.hqt>*,.hqt2>*{pointer-events:auto}
.hqb{padding:6px 10px;border-radius:10px;background:#0b0b14cc;border:1px solid #ffffff26;font-size:13px;min-height:34px}.hqb[aria-pressed=true]{background:linear-gradient(90deg,#8b5cf6aa,#38bdf866)}
.hqt2 select{width:auto;max-width:44%;margin:0;padding:6px 8px;font-size:13px;background:#0b0b14cc}.hqm{font-size:11px;color:#fff;background:#0b0b14cc;border-radius:99px;padding:3px 9px}
.hqp{position:absolute;left:8px;bottom:8px;width:min(340px,calc(100% - 16px));max-height:58%;overflow:auto;background:#14141ff0;border:1px solid #ffffff1f;border-radius:14px;padding:12px;z-index:4}.hqph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hqk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.hqk div{background:var(--g2);border-radius:10px;padding:6px;text-align:center}.hqk b{display:block;font-size:18px}.hqk span{font-size:10px;color:var(--m)}
.hqf{position:absolute;right:8px;bottom:8px;font:11px ui-monospace,monospace;background:#000b;padding:4px 8px;border-radius:8px;z-index:3}
@media(max-width:760px){.hqb span{display:none}.hqt2 select{max-width:42%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<nav id="nav"></nav><main id="v"></main><div id="md" class="md" hidden></div><div id="tt"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
try{const T=await import('three'),L=await import('three/addons/loaders/GLTFLoader.js');window.THREE=T;window.GLTFLoaderCls=L.GLTFLoader}catch(e){window.THREE_ERR=(e&&e.message)||'chargement impossible'}
window.dispatchEvent(new Event('hq-three'));
</script>
<script>
/* ===== NEXORA AI v0.2 : fichier unique, stockage local, moteur de démonstration, siège social 3D ===== */
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

/* --- Données : 17 départements x 2 agents = 34 agents --- */
const DEP=['Direction','Marketing','Communication','Commercial','Prospection','Finance','Administration','Ressources humaines','Création','Production','Recherche','Analyse','Service client','Technologie','Développement','Sécurité','Stratégie'];
const RAW=`Orion|Chef de cabinet|coordination,priorisation
Lyra|Contrôleuse qualité|vérification,synthèse
Maya|Stratège marketing|positionnement,campagnes
Noé|Growth marketer|acquisition,tests A/B
Iris|Rédactrice|rédaction,storytelling
Hugo|Community manager|réseaux sociaux,calendrier éditorial
Léa|Responsable ventes|offres,négociation
Tom|Account manager|fidélisation,vente additionnelle
Zoé|Prospectrice|ciblage,séquences de contact
Eli|Analyste leads|qualification,scoring
Victor|Analyste financier|budget,marges
Nina|Trésorière|trésorerie,prévisions
Sacha|Gestionnaire administratif|procédures,documents
Inès|Assistante exécutive|planning,comptes rendus
Camille|Responsable RH|recrutement,organisation
Malo|Formateur|formation,intégration
Jade|Directrice artistique|identité visuelle,maquettes
Axel|Scénariste|scripts,vidéo
Roxane|Cheffe de projet|planification,livraison
Basile|Optimiseur de processus|workflows,qualité
Alma|Veilleuse|veille,benchmark
Théo|Chercheur|synthèse de sources,études
Sofia|Data analyst|indicateurs,tableaux
Karim|Analyste risques|risques,scénarios
Lola|Conseillère support|réponses,FAQ
Dan|Médiateur|litiges,satisfaction
Nova|Architecte logiciel|architecture,outils
Rémi|Intégrateur|automatisation,connexions
Enzo|Développeur front|HTML/JS,ergonomie
Mila|Développeuse logique|algorithmes,tests
Gabin|Responsable sécurité|audit,accès
Salomé|Responsable conformité|RGPD,politiques internes
Adèle|Stratège|plans,vision
Louis|Analyste concurrence|concurrents,marché`;
const AG=RAW.split('\n').map((l,i)=>{const[n,j,s]=l.split('|');return{id:'A'+String(i+1).padStart(2,'0'),n,j,d:DEP[i>>1],s:s.split(',')}});
const ag=id=>AG.find(a=>a.id==id)||{id,n:'Agent supprimé',j:'—',d:'—',s:['—','—']},nm=id=>id=='DIR'?'Directeur':ag(id).n;
const COL={'Disponible':'#34d399','En mission':'#38bdf8','En réflexion':'#8b5cf6','En collaboration':'#fb923c','En attente':'#facc15','Terminé':'#a3e635','En erreur':'#f87171'};
/* Routage du directeur : mots-clés -> départements */
const R=[[/market|campagne|pub|promo|annonce/i,['Marketing','Communication','Création']],[/vent|commerc|offre|prospect|client/i,['Commercial','Prospection','Service client']],[/financ|budget|tréso|prix|marge|coût/i,['Finance','Analyse']],[/sécur|rgpd|risque|audit/i,['Sécurité','Analyse']],[/site|app|code|dév|techno|outil/i,['Technologie','Développement']],[/équipe|recrut|rh\b|planning|semaine|organis/i,['Administration','Ressources humaines','Production']],[/recherch|veille|concurr|march|étude/i,['Recherche','Stratégie']],[/strat|améliorat|entreprise|projet/i,['Stratégie','Analyse']]];

/* --- Stockage local versionné --- */
function load(){try{const x=JSON.parse(localStorage.getItem('nexora_v1'));if(x&&x.v===1)return x}catch(e){}return{v:1,ws:'Mon espace',ms:[],msg:[],docs:[],chat:{}}}
let S=load();S.chat=S.chat||{};S.au=S.au||[];S.off=S.off||[];S.ca=S.ca||[];S.pf=S.pf||{};S.hq=S.hq||{};syncCA();S.st={};
S.ms.forEach(m=>{if(m.s=='En cours'){m.s='En attente';m.steps.forEach(x=>{if(x.st=='run')x.st=''})}});
function save(){try{localStorage.setItem('nexora_v1',JSON.stringify(S))}catch(e){toast('Sauvegarde impossible : stockage plein ou bloqué')}}
const off=a=>S.off.includes(a.id),st=a=>off(a)?'En attente':(S.st[a.id]||'Disponible');
function toast(t){const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* --- Moteur de démonstration (aucun modèle IA) --- */
const T={};
function plan(q){let d=['Direction'];R.forEach(r=>{if(r[0].test(q))r[1].forEach(x=>d.includes(x)||d.push(x))});if(d.length<2)d.push('Stratégie','Analyse');
 const ids=[...new Set(d.map(x=>AG.find(a=>a.d==x&&!off(a)&&a.perm!='Lecture seule')).filter(Boolean).slice(0,5).map(a=>a.id))];ids.push('A02');return ids} /* chaque agent une seule fois : pas de boucle */
function work(a,q){return `Contribution de ${a.n} (${a.j}, ${a.d})\nDemande : ${q}\nExpertise mobilisée : ${a.s.join(', ')}\n${a.ins?'Instructions de l\'agent : '+a.ins+'\n':''}1. Cadrer l'objectif et les contraintes (${a.s[0]})\n2. Trois actions à étudier dans mon domaine (${a.s[1]})\n3. Points à vérifier par vous avant toute décision\n[Trame du moteur local de démonstration : pas d'analyse IA réelle]`}
function mk(title,req,prio,due,ids){const m={id:uid(),title,req,prio,due,s:'En cours',steps:ids.map(a=>({a,st:''})),ts:Date.now()};
 S.ms.unshift(m);S.msg.unshift({f:'DIR',t:ids[0],m:m.id,i:'Démarrer la mission : '+title,r:'Instructions transmises',s:'Envoyé',ts:Date.now()});save();step(m)}
function step(m){const i=m.steps.findIndex(x=>x.st!='ok');if(i<0)return fin(m);
 const x=m.steps[i],a=ag(x.a);m.s='En cours';x.st='run';S.st[a.id]='En réflexion';save();draw();
 T[m.id]=setTimeout(()=>{x.t=work(a,m.req);x.st='ok';S.st[a.id]='Terminé';const nx=m.steps[i+1];if(nx)HO[a.id]=nx.a;else delete HO[a.id];
  S.msg.unshift({f:a.id,t:nx?nx.a:'DIR',m:m.id,i:nx?'Transmettre ma contribution à '+nm(nx.a):'Remettre la validation finale',r:x.t.split('\n').slice(0,2).join(' · '),s:'Livré',ts:Date.now()});
  S.msg.length=Math.min(S.msg.length,200);save();draw();
  setTimeout(()=>{if(S.st[a.id]=='Terminé'){delete S.st[a.id];draw()}},4500);step(m)},1100)}
function fin(m){m.s='En validation';const id=uid();m.doc=id;
 S.docs.unshift({id,t:'Synthèse : '+m.title,b:`SYNTHÈSE : ${m.title}\nDemande : ${m.req}\n\n`+m.steps.map(x=>x.t).join('\n\n———\n\n'),src:'Source : moteur local de démonstration (aucun modèle IA connecté)',ts:Date.now()});
 save();draw();toast('Mission en validation')}
function itr(id){const m=S.ms.find(x=>x.id==id);clearTimeout(T[id]);m.s='En attente';m.steps.forEach(x=>{if(x.st=='run'){x.st='';S.st[x.a]='En attente'}});save();draw()}
function rl(id){const m=S.ms.find(x=>x.id==id);m.steps.forEach(x=>{if(x.st=='run')x.st=''});step(m)}
function vl(id){S.ms.find(x=>x.id==id).s='Terminée';save();draw();toast('Mission validée')}
function dm(id){if(!confirm('Supprimer cette mission ?'))return;clearTimeout(T[id]);S.ms=S.ms.filter(x=>x.id!=id);save();draw(1)}
function launch(){const q=$('#q').value.trim();if(!q)return toast('Décrivez d’abord la demande');mk(q.slice(0,60),q,$('#pr').value,$('#du').value,plan(q));go('miss')}

/* --- Vues --- */
const msgH=x=>`<div class=s>${new Date(x.ts).toLocaleTimeString('fr-FR')} · ${nm(x.f)} → ${nm(x.t)} · ${E(x.s)}</div>`;
const ab=a=>`<button class=ab onclick="op('${a.id}')"><span class=dot style="background:${COL[st(a)]}"></span>${a.n}</button>`;
const mt=id=>(S.ms.find(m=>m.id==id)||{title:'(supprimée)'}).title;
const VW={
dash(){const c=s=>S.ms.filter(m=>m.s==s).length,bz=Object.values(S.st).filter(x=>x!='Disponible').length,ac=Object.values(S.st).filter(x=>['En mission','En réflexion','En collaboration'].includes(x)).length;
 return `<h2>${E(S.ws)}</h2><div class=gr>${[['Agents',AG.length],['Disponibles',AG.length-bz],['Agents actifs',ac],['Missions en cours',c('En cours')],['En validation',c('En validation')],['Terminées',c('Terminée')],['En attente',c('En attente')],['Livrables',S.docs.length]].map(x=>`<div class=c><div class=k>${x[1]}</div><div class=s>${x[0]}</div></div>`).join('')}</div>
 <div class=c><b>Consommation IA</b><div class=s>0 jeton : aucun modèle IA connecté. Les résultats viennent du moteur local de démonstration.</div></div>
 <div class=c><b>Derniers échanges</b>${S.msg.slice(0,5).map(msgH).join('')||'<div class=s>Aucun échange. Confiez une mission au directeur.</div>'}</div>`},
bureau(){return `<h2>Bureau virtuel</h2><div class=s style="margin-bottom:10px">Siège social 3D : glissez pour tourner, pincez ou molette pour zoomer, deux doigts (ou ✋) pour déplacer. Touchez un agent pour ouvrir sa fiche, un département pour ses statistiques. Toit retiré, murs en coupe. Les déplacements suivent le statut réel des agents ; les liens lumineux relient les agents d’une même mission. La vue simplifiée est juste en dessous.</div><div id=c3 style="height:min(72vh,560px);margin:10px 0;border-radius:14px;border:1px solid #ffffff14;overflow:hidden;touch-action:none;background:#0b0b14"></div><div id=b2>${B2()}</div>`},
b2(){return `<div class=gr style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${DEP.map(d=>`<div class=c><b>${d}</b><br>${AG.filter(a=>a.d==d).map(ab).join('')}</div>`).join('')}</div>
 <div class=s>${Object.keys(COL).map(k=>`<span class=dot style="background:${COL[k]}"></span> ${k}`).join(' &nbsp; ')}</div>`},
dir(){return `<h2>Directeur IA</h2><div class=c><div class=w>Moteur local de démonstration : aucun modèle IA connecté. Le directeur choisit les agents par mots-clés et assemble des trames de travail, sans analyse réelle.</div>
 <textarea id=q placeholder="Ex. : Prépare une campagne publicitaire pour ma boutique"></textarea>
 <div class=row><select id=pr><option>Normale<option>Haute<option>Basse</select><input id=du type=date style="width:auto"><button class=p onclick="launch()">Confier au directeur</button></div></div>`},
team(){return `<h2>Équipe : ${AG.length} agents</h2><div class=gr style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${AG.map(a=>`<div class=c style="cursor:pointer" onclick="op('${a.id}')"><span class=av>${a.n[0]}</span><b>${a.n}</b> <span class=dot style="background:${COL[st(a)]}"></span><div class=s>${a.j} · ${a.d}</div><div class=s>${a.s.join(', ')}</div></div>`).join('')}</div>`},
miss(){return `<h2>Missions</h2>`+(S.ms.map(m=>`<div class=c><b>${E(m.title)}</b> <span class=bd>${m.s}</span> <span class=bd>${m.prio}</span>${m.due?` <span class=s>échéance ${E(m.due)}</span>`:''}<div class=s>${E(m.req)}</div>${m.steps.map(x=>`<div class=s>${x.st=='ok'?'✅':x.st=='run'?'⏳':'▫️'} ${nm(x.a)} (${ag(x.a).j})</div>`).join('')}
 <div class=row>${m.s=='En cours'?`<button onclick="itr('${m.id}')">Interrompre</button>`:''}${m.s=='En attente'?`<button class=p onclick="rl('${m.id}')">Relancer</button>`:''}${m.s=='En validation'?`<button class=p onclick="vl('${m.id}')">Valider</button>`:''}${m.doc?`<button onclick="S.cur='${m.doc}';go('docs')">Voir le livrable</button>`:''}<button onclick="HQ.visitMission('${m.id}')">Voir au bureau</button><button class=d onclick="dm('${m.id}')">Supprimer</button></div></div>`).join('')||'<div class=s>Aucune mission. Confiez-en une au directeur ou attribuez une tâche depuis la fiche d’un agent.</div>')},
comm(){return `<h2>Échanges inter-agents</h2>`+(S.msg.map(x=>`<div class=c><b>${nm(x.f)} → ${nm(x.t)}</b> <span class=bd>${E(x.s)}</span><div class=s>${new Date(x.ts).toLocaleString('fr-FR')} · mission : ${E(mt(x.m))}</div><div class=s>Instruction : ${E(x.i)}</div><pre>${E(x.r)}</pre></div>`).join('')||'<div class=s>Aucun échange pour l’instant.</div>')},
docs(){const d=S.docs.find(x=>x.id==S.cur)||S.docs[0];
 return `<h2>Livrables</h2><div class=c>${S.docs.map(x=>`<button class=ab onclick="S.cur='${x.id}';draw(1)">${E(x.t)}</button>`).join('')||'<span class=s>Aucun livrable.</span>'} <button onclick="nd()">+ Nouveau</button></div>`+
 (d?`<div class=c><input id=dt value="${E(d.t)}"><textarea id=db style="min-height:240px">${E(d.b)}</textarea><div class=s>${E(d.src)}</div><div class=row><button class=p onclick="sd('${d.id}')">Enregistrer</button><button onclick="cp()">Copier</button>${['txt','csv','html','json'].map(f=>`<button onclick="ex('${d.id}','${f}')">.${f}</button>`).join('')}<button class=d onclick="dd('${d.id}')">Supprimer</button></div></div>`:'')},
cust(){return `<h2>Mes agents</h2><div class=c><div class=s>Créez vos agents : ils rejoignent l’équipe, apparaissent dans le bureau et sont sauvegardés localement. Leurs instructions sont ajoutées à leurs trames de travail ; sans IA connectée, elles ne pilotent pas un vrai modèle. Un agent en lecture seule n’est jamais choisi par le directeur, mais vous pouvez lui parler ou lui attribuer une tâche.</div>
 <input id=xn placeholder="Nom"><input id=xj placeholder="Métier"><select id=xd>${DEP.map(d=>`<option>${d}`).join('')}</select><input id=xs placeholder="Compétences, séparées par des virgules"><textarea id=xi placeholder="Instructions spécialisées"></textarea><textarea id=xm placeholder="Mémoire de travail (contexte à retenir)"></textarea>
 <select id=xp><option>Peut produire des livrables<option>Lecture seule</select><div class=row><button class=p id=xb onclick="cxs()">Créer l’agent</button></div></div><div id=xl>${CL()}</div>`},
conf(){const p=S.pf||{},T=['Particulier','Entrepreneur','Indépendant','Commerce','Boutique','Artisan','PME','Grande entreprise','Créateur de contenu','Autre'],U=['Je valide chaque étape','Équilibré','Autonome'];
 return `<h2>Assistant de configuration</h2><div class=c><div class=s>Décrivez votre activité : l’assistant propose une équipe, que vous modifiez librement avant de l’appliquer. La proposition suit des règles simples (type d’activité, mots-clés), pas une IA. Le niveau d’autonomie est enregistré mais le moteur local ne l’utilise pas encore.</div>
 <select id=ft>${T.map(t=>`<option${p.type==t?' selected':''}>${t}`).join('')}</select><input id=fn placeholder="Nom de l’activité" value="${E(p.nom)}"><input id=fs placeholder="Secteur" value="${E(p.sect)}">
 <textarea id=fo placeholder="Objectifs">${E(p.obj)}</textarea><textarea id=fd placeholder="Difficultés">${E(p.diff)}</textarea><textarea id=fa placeholder="Tâches à automatiser">${E(p.tach)}</textarea>
 <input id=fb type=number min=2 max=${AG.length} placeholder="Nombre d’agents souhaité" value="${p.nb||''}"><select id=fu>${U.map(t=>`<option${p.auto==t?' selected':''}>${t}`).join('')}</select>
 <div class=row><button class=p onclick="fprop()">Proposer une équipe</button></div></div><div id=ft2></div>`},
auto(){return `<h2>Automatisations</h2><div class=c><div class=w>Elles s’exécutent uniquement quand cette page est ouverte dans le navigateur. Page fermée, rien ne tourne : une exécution manquée est rattrapée une seule fois à la réouverture. Chaque exécution crée une mission du moteur local de démonstration.</div>

function visitMission(mid){if(V!='bureau'){PEND={t:'m',id:mid};go('bureau');return}if(!R||!R.el)return toast('Vue 3D indisponible');const m=S.ms.find(x=>x.id==mid);if(!m)return;const us=m.steps.map(x=>R.ag[x.a]).filter(Boolean);if(!us.length)return;let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;us.forEach(u=>{const p=u.g.position;x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);z0=Math.min(z0,p.z);z1=Math.max(z1,p.z)});R.selMission=mid;flyTo({tx:(x0+x1)/2,tz:(z0+z1)/2,ty:0,dist:clamp(Math.max(x1-x0,z1-z0)*1.1+14,16,100),el:.85,az:.5},1.2);setSel({});toast('Collaboration : '+us.length+' agents liés par la mission')}
function toggle(k){const h=hq();if(k=='walls')h.walls=h.walls=='high'?'low':'high';else if(k=='glb')h.glb=h.glb===false;else h[k]=!h[k];save();if(k=='fps'&&R&&R.el){const f=R.el.querySelector('#hqf');if(f)f.hidden=!h.fps}if(k=='glb'&&R&&R.rd)R.sig=null;toast({roof:h.roof?'Toit en place':'Toit retiré',walls:h.walls=='high'?'Murs hauts':'Murs bas (coupe)',fps:h.fps?'FPS affichés':'FPS masqués',glb:h.glb===false?'Mobilier GLB désactivé':'Mobilier GLB activé'}[k]||'OK')}

 R.el=el;el.innerHTML='';el.style.position='relative';const dom=R.rd.domElement;dom.style.cssText='display:block;width:100%;height:100%;touch-action:none;outline:none';el.appendChild(dom);buildUI(el);R.modeTxt=null;R.warm=0;R.w=0;
 if(!R.built){R.built=1;rebuild();bind(dom);applyQ();overview(true);loadAssets()}else{resize();if(R.sig!==sigNow()||R.glbs!==(hq().glb!==false))rebuild()}
 start();if(PEND){const p=PEND;PEND=null;setTimeout(()=>{p.t=='a'?visitAgent(p.id):p.t=='m'?visitMission(p.id):visitZone(p.id)},80)}}
function techHTML(){const s=STATS,h=hq(),ago=s.t?Math.round((Date.now()-s.t)/1000)+' s':'—',nk=Object.keys(LIB.kinds).length;
 return `<div class=c><b>Paramètres techniques 3D</b><div class=s>FPS (dernière mesure dans la vue Bureau) : <b>${s.t?s.fps:'—'}</b> · minimum ${s.t?s.min:'—'} · mesuré il y a ${ago}<br>Qualité active : ${E(s.q||'—')} · appels de rendu : ${s.calls} · triangles : ${s.tris}<br>GPU : ${E(s.gpu||'—')}<br>Objectif : 30 FPS minimum, 60 si possible. La mesure ne tourne que lorsque la vue Bureau est ouverte.</div>

/* --- Automatisations locales : actives seulement page ouverte --- */
const EV={5:'toutes les 5 min (test)',60:'chaque heure',1440:'chaque jour',10080:'chaque semaine',43200:'chaque mois (30 jours)'};

let AE=null;
const AL=()=>S.au.map(a=>`<div class=c><b>${E(a.t)}</b> <span class=bd>${a.on?'Active':'En pause'}</span> <span class=bd>${EV[a.ev]||a.ev+' min'}</span><div class=s>${E(a.req)}</div><div class=s>Dernière exécution : ${a.last?new Date(a.last).toLocaleString('fr-FR'):'jamais'} · prochaine : ${a.on?new Date(a.next).toLocaleString('fr-FR'):'en pause'}</div>
 <div class=row><button onclick="atg('${a.id}')">${a.on?'Mettre en pause':'Activer'}</button><button onclick="aed('${a.id}')">Modifier</button><button onclick="arun('${a.id}')">Exécuter maintenant</button><button class=d onclick="adl('${a.id}')">Supprimer</button></div></div>`).join('')||'<div class=s>Aucune automatisation. Choisissez un modèle ci-dessus ou écrivez la vôtre.</div>';
function apre(i){const p=PRE[i];AE=null;$('#at').value=p[0];$('#ar').value=p[1];$('#ae').value=p[2];$('#asb').textContent='Créer'}
function asv(){const t=$('#at').value.trim(),r=$('#ar').value.trim(),ev=+$('#ae').value;if(!t||!r)return toast('Renseignez un titre et une demande');
 if(AE){Object.assign(S.au.find(x=>x.id==AE),{t,req:r,ev,next:Date.now()+ev*6e4})}else S.au.unshift({id:uid(),t,req:r,ev,on:true,last:0,next:Date.now()+ev*6e4});
 AE=null;save();draw(1);toast('Automatisation enregistrée')}
function aed(id){const a=S.au.find(x=>x.id==id);AE=id;$('#at').value=a.t;$('#ar').value=a.req;$('#ae').value=a.ev;$('#asb').textContent='Mettre à jour';$('#at').focus()}
function atg(id){const a=S.au.find(x=>x.id==id);a.on=!a.on;if(a.on)a.next=Date.now()+a.ev*6e4;save();draw()}
function adl(id){if(!confirm('Supprimer cette automatisation ?'))return;S.au=S.au.filter(x=>x.id!=id);save();draw()}
function arun(id,q){const a=S.au.find(x=>x.id==id);a.last=Date.now();a.next=a.last+a.ev*6e4;save();mk(a.t,a.req,'Normale','',plan(a.req));if(!q)toast('Mission créée');draw()}

/* --- Agents personnalisés --- */
let CE=null;
function syncCA(){for(let i=AG.length-1;i>=0;i--)if(AG[i].c)AG.splice(i,1);AG.push(...S.ca)}
const CL=()=>S.ca.map(a=>`<div class=c><span class=av>${E(a.n[0]||'?')}</span><b>${E(a.n)}</b> <span class=bd>${E(a.d)}</span> ${off(a)?'<span class=bd>Désactivé</span>':''}<div class=s>${E(a.j)} · ${E(a.s.join(', '))} · ${E(a.perm)}</div>
 <div class=row><button onclick="op('${a.id}')">Fiche</button><button onclick="cxe('${a.id}')">Modifier</button><button onclick="cxd('${a.id}')">Dupliquer</button><button onclick="cxt('${a.id}')">${off(a)?'Activer':'Désactiver'}</button><button class=d onclick="cxx('${a.id}')">Supprimer</button></div></div>`).join('')||'<div class=s>Aucun agent personnalisé pour l’instant.</div>';
function cxs(){const n=$('#xn').value.trim(),j=$('#xj').value.trim();if(!n||!j)return toast('Le nom et le métier sont obligatoires');
 let k=$('#xs').value.split(',').map(x=>x.trim()).filter(Boolean);if(!k.length)k=['polyvalence'];if(k.length<2)k.push('coordination');
 const v={n,j,d:$('#xd').value,s:k,ins:$('#xi').value.trim(),mem:$('#xm').value.trim(),perm:$('#xp').value};
 if(CE)Object.assign(S.ca.find(a=>a.id==CE),v);else S.ca.push({id:'C'+uid(),c:1,...v});
 CE=null;save();syncCA();draw(1);toast('Agent enregistré')}
function cxe(id){const a=S.ca.find(x=>x.id==id);CE=id;$('#xn').value=a.n;$('#xj').value=a.j;$('#xd').value=a.d;$('#xs').value=a.s.join(', ');$('#xi').value=a.ins;$('#xm').value=a.mem;$('#xp').value=a.perm;$('#xb').textContent='Mettre à jour';$('#xn').focus()}
function cxd(id){const a=S.ca.find(x=>x.id==id);S.ca.push({...a,s:[...a.s],id:'C'+uid(),n:a.n+' (copie)'});save();syncCA();draw();toast('Agent dupliqué')}
function cxt(id){const i=S.off.indexOf(id);i<0?S.off.push(id):S.off.splice(i,1);save();draw()}
function cxx(id){if(!confirm('Supprimer cet agent ? Ses missions passées resteront, marquées « Agent supprimé ».'))return;S.ca=S.ca.filter(a=>a.id!=id);S.off=S.off.filter(x=>x!=id);syncCA();save();draw()}
/* --- Assistant de configuration : proposition d'équipe par règles simples --- */
const CM=['Marketing','Communication','Commercial','Service client','Finance','Création'],EN=['Stratégie','Marketing','Finance','Administration','Commercial'];
const TY={Commerce:CM,Boutique:CM,Artisan:CM,'Créateur de contenu':['Création','Communication','Marketing','Analyse'],Entrepreneur:EN,'Indépendant':EN,Particulier:['Administration','Finance','Recherche','Stratégie'],Autre:['Stratégie','Analyse','Communication']};
function fprop(){const g=i=>$('#'+i).value.trim(),ty=g('ft'),tx=g('fo')+' '+g('fd')+' '+g('fa'),big=/PME|Grande/.test(ty);
 S.pf={type:ty,nom:g('fn'),sect:g('fs'),obj:g('fo'),diff:g('fd'),tach:g('fa'),nb:+g('fb')||0,auto:g('fu')};if(S.pf.nom)S.ws=S.pf.nom;
 const d=['Direction',...(big?DEP:TY[ty]||TY.Autre)];R.forEach(r=>{if(r[0].test(tx))r[1].forEach(x=>d.includes(x)||d.push(x))});
 const L=AG.filter(a=>d.includes(a.d)),n=S.pf.nb||(big?AG.length:12),f1=L.filter((a,i)=>L.findIndex(b=>b.d==a.d)==i),f2=L.filter((a,i)=>L.findIndex(b=>b.d==a.d)!=i);
 const ok=new Set([...new Set(['A01','A02',...f1.map(a=>a.id),...f2.map(a=>a.id)])].slice(0,Math.max(n,2)));save();
 $('#ft2').innerHTML=`<div class=c><b>Équipe proposée : ${ok.size} agents</b><div class=s>Cochez ou décochez librement, puis appliquez. Orion et Lyra (direction et contrôle qualité) restent toujours actifs.</div>${DEP.map(x=>{const m=AG.filter(a=>a.d==x);return m.length?`<div class=s style="margin-top:6px"><b>${x}</b></div>`+m.map(a=>`<label class=ab><input type=checkbox style="width:auto;margin:0" class=fk value="${a.id}"${ok.has(a.id)?' checked':''}${a.id=='A01'||a.id=='A02'?' disabled checked':''}> ${E(a.n)} <span class=s>${E(a.j)}</span></label>`).join(''):''}).join('')}<div class=row><button class=p onclick="fapp()">Appliquer cette équipe</button></div></div>`;toast('Équipe proposée')}
function fapp(){const on=new Set([...document.querySelectorAll('.fk:checked')].map(x=>x.value));S.off=AG.filter(a=>a.id!='A01'&&a.id!='A02'&&!on.has(a.id)).map(a=>a.id);save();toast('Équipe appliquée : '+(AG.length-S.off.length)+' agents actifs')}

function op(id){const a=ag(id),M=$('#md');M.hidden=false;M.onclick=e=>{if(e.target.id=='md')cl()};
