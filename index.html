<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04070d">
  <title>AURION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:#04070d; --ink2:#071018; --panel:#0a1522; --line:#1a3348; --soft:#10202e;
      --ivory:#e8f4ff; --muted:#7d97ad; --faint:#4e677c; --gold:#39e7ff; --jade:#3dffc0; --rose:#ff4d78;
      --sans:"Space Grotesk",ui-sans-serif,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--ink); color:var(--ivory); font-family:var(--sans); }
    body { min-height:100dvh; background-image:linear-gradient(rgba(57,231,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(57,231,255,.05) 1px,transparent 1px); background-size:48px 48px; }
    button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
    .app { display:flex; height:100dvh; }
    nav.rail { display:none; width:5.5rem; flex-direction:column; align-items:center; gap:.25rem; border-right:1px solid var(--line); background:rgba(7,16,24,.92); padding:.75rem 0; }
    .mark { color:var(--gold); font-weight:700; letter-spacing:.12em; font-size:.75rem; }
    nav.rail button, nav.dock button { color:var(--muted); }
    nav.rail button.on, nav.dock button.on { color:var(--gold); background:rgba(57,231,255,.12); }
    nav.rail button { width:4.4rem; height:3.4rem; border-radius:.25rem; font-size:.7rem; }
    .stage { min-width:0; flex:1; display:flex; flex-direction:column; }
    header.top { display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem; border-bottom:1px solid var(--line); background:rgba(7,16,24,.85); }
    .sub { color:var(--faint); font-family:var(--mono); font-size:.72rem; }
    .eq { margin-left:auto; text-align:right; }
    .eq b { font-family:var(--mono); font-size:1.05rem; }
    .ticker { display:flex; overflow:hidden; border-bottom:1px solid var(--line); }
    .ticker button { height:2.4rem; padding:0 .75rem; border-right:1px solid var(--soft); font-size:.75rem; white-space:nowrap; }
    main { flex:1; overflow:auto; padding:.85rem; padding-bottom:5.5rem; }
    .grid { display:grid; gap:.75rem; }
    .kpis { grid-template-columns:repeat(2,1fr); }
    .card { border:1px solid var(--line); background:rgba(10,21,34,.9); border-radius:.4rem; padding:.85rem; }
    .k { color:var(--faint); font-size:.72rem; }
    .v { font-family:var(--mono); margin-top:.2rem; }
    h2 { margin:0 0 .6rem; font-size:.9rem; }
    .jade { color:var(--jade); } .rose { color:var(--rose); } .gold { color:var(--gold); } .muted { color:var(--muted); } .faint { color:var(--faint); }
    .row { display:flex; align-items:center; gap:.6rem; width:100%; text-align:left; padding:.55rem 0; border-bottom:1px solid var(--soft); }
    .row:last-child { border-bottom:0; }
    .grow { flex:1; min-width:0; }
    .right { text-align:right; }
    .mono { font-family:var(--mono); }
    svg.chart { width:100%; height:11rem; display:block; }
    .dock { position:fixed; left:0; right:0; bottom:0; display:flex; border-top:1px solid var(--line); background:rgba(4,7,13,.94); }
    .dock button { flex:1; height:4rem; font-size:.72rem; }
    .live { display:inline-flex; align-items:center; gap:.35rem; color:var(--jade); font-size:.75rem; }
    .dot { width:.4rem; height:.4rem; border-radius:99px; background:currentColor; }
    .pills { display:flex; flex-wrap:wrap; gap:.4rem; }
    .pill, .arm { border:1px solid var(--line); border-radius:.25rem; min-height:2.75rem; padding:0 .8rem; }
    .pill.on { border-color:var(--gold); color:var(--gold); }
    .arm { background:var(--gold); color:var(--ink); font-weight:600; }
    .arm.off { background:transparent; color:var(--ivory); }
    .note { color:var(--muted); font-size:.9rem; line-height:1.45; }
    .log { font-size:.85rem; padding:.45rem 0; border-bottom:1px solid var(--soft); }
    @media (min-width:900px) {
      nav.rail { display:flex; }
      .dock { display:none; }
      main { padding-bottom:1rem; }
      .kpis { grid-template-columns:repeat(4,1fr); }
      .split { grid-template-columns:1.4fr .8fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const START = 100000, FEE = 0.0004, MAX = 3;
    const PAIRS = [
      { id:"BTC", name:"Bitcoin", start:97420, vol:0.00155, digits:1, seed:11 },
      { id:"ETH", name:"Ethereum", start:3618, vol:0.00205, digits:2, seed:23 },
      { id:"SOL", name:"Solana", start:186.4, vol:0.0031, digits:2, seed:37 },
      { id:"BNB", name:"BNB", start:614.2, vol:0.00175, digits:2, seed:41 },
      { id:"AVAX", name:"Avalanche", start:38.64, vol:0.0033, digits:2, seed:53 },
      { id:"XAU", name:"Or", start:2684, vol:0.00072, digits:2, seed:67 }
    ];
    const STRATS = {
      pulse: ["Pulse", "Momentum filtré. EMA 9 contre EMA 21, RSI hors extrême."],
      revert: ["Reversion", "Achète la faiblesse sous RSI 34, vend la force au-dessus de 66."],
      breakout: ["Rupture", "Entre à la clôture hors du range des 20 dernières bougies."],
      anchor: ["Ancre", "Vend l’extension au-dessus de l’EMA 21, achète le décrochage."]
    };
    const VIEWS = [["desk","Desk"],["marche","Marché"],["cortex","Cortex"],["robot","Robot"],["livre","Livre"]];
    function mulberry32(seed){ let a=seed>>>0; return ()=>{ a|=0; a=(a+0x6d2b79f5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
    function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }
    function ema(values, period){ const k=2/(period+1); const out=[]; let prev=values[0]||0; for (let i=0;i<values.length;i++){ prev=i===0?values[0]:values[i]*k+prev*(1-k); out.push(prev); } return out; }
    function rsi(values, period=14){ const out=Array(values.length).fill(50); if (values.length<=period) return out; let gain=0, loss=0; for (let i=1;i<=period;i++){ const d=values[i]-values[i-1]; if (d>=0) gain+=d; else loss-=d; } gain/=period; loss/=period; out[period]=loss===0?100:100-100/(1+gain/loss); for (let i=period+1;i<values.length;i++){ const d=values[i]-values[i-1]; const g=d>0?d:0, l=d<0?-d:0; gain=(gain*(period-1)+g)/period; loss=(loss*(period-1)+l)/period; out[i]=loss===0?100:100-100/(1+gain/loss); } return out; }
    function atr(candles, period=14){ const tr=candles.map((c,i)=>i===0?c.h-c.l:Math.max(c.h-c.l, Math.abs(c.h-candles[i-1].c), Math.abs(c.l-candles[i-1].c))); const out=Array(tr.length).fill(tr[0]||0); if (tr.length<=period) return out; let acc=0; for (let i=0;i<period;i++) acc+=tr[i]; out[period-1]=acc/period; for (let i=period;i<tr.length;i++) out[i]=(out[i-1]*(period-1)+tr[i])/period; return out; }
    function signalAt(candles, strategy){ if (candles.length<30) return "flat"; const closes=candles.map(c=>c.c); const i=closes.length-1; const e9=ema(closes,9), e21=ema(closes,21); const r=rsi(closes)[i]; const a=atr(candles)[i]; const price=closes[i]; if (strategy==="pulse"){ const gap=(e9[i]-e21[i])/Math.max(a, price*0.0004); if (gap>0.22 && r>48 && r<75) return "long"; if (gap<-0.22 && r<52 && r>25) return "short"; return "flat"; } if (strategy==="revert"){ if (r<34) return "long"; if (r>66) return "short"; return "flat"; } if (strategy==="breakout"){ const window=candles.slice(Math.max(0,i-20), i); if (window.length<10) return "flat"; const hi=Math.max(...window.map(c=>c.h)), lo=Math.min(...window.map(c=>c.l)); if (price>hi) return "long"; if (price<lo) return "short"; return "flat"; } const band=Math.max(a*1.25, price*0.0012); const dist=price-e21[i]; if (dist<-band) return "long"; if (dist>band) return "short"; return "flat"; }
    function stepPrice(price, regime, vol, rnd, tempo = 1) {
      const next = clamp(regime * (1 - 0.01 * tempo) + (rnd() - 0.478) * 0.05 * tempo, -1, 1);
      const noise = vol * tempo * (0.32 + (1 - Math.abs(next)) * 0.38);
      return { price: Math.max(1e-6, price * (1 + next * vol * tempo * 1.05 + (rnd() - 0.5) * noise * 2)), regime: next };
    }
    function build(pair, n){ const rnd=mulberry32(pair.seed); let price=pair.start, regime=((pair.seed%5)-2)*0.4; const candles=[]; for (let i=0;i<n;i++){ const o=price; const stepped=stepPrice(price, regime, pair.vol, rnd); price=stepped.price; regime=stepped.regime; const span=Math.abs(price-o)*(0.18+rnd()*0.45); candles.push({ o, h:Math.max(o,price)+span*rnd(), l:Math.min(o,price)-span*(1-rnd())*0.85, c:price, v:(40+rnd()*160)*(1+Math.abs(regime)) }); } return { candles, regime }; }
    function money(n){ const sign=n<0?"−":""; return sign+Math.abs(n).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" USDT"; }
    function px(n,d){ return n.toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
    function pct(n){ return (n>=0?"+":"−")+Math.abs(n*100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" %"; }
    const state = { books:{}, regime:{}, cash:START, positions:[], trades:[], logs:[], curve:[], tick:0, running:true, halted:false, strategy:"pulse", risk:0.012, enabled:{}, focus:"BTC", view:"desk" };
    PAIRS.forEach(p => state.enabled[p.id]=true);
    function equity(){ let u=state.cash; for (const p of state.positions){ const pxn=state.books[p.pair].forming.c; u += p.side==="long"?(pxn-p.entry)*p.qty:(p.entry-pxn)*p.qty; } return u; }
    function closePos(pos, exit, reason){ const raw=pos.side==="long"?(exit-pos.entry)*pos.qty:(pos.entry-exit)*pos.qty; const fees=(pos.entry+exit)*pos.qty*FEE; const pnl=raw-fees; state.cash += raw - exit*pos.qty*FEE; state.trades.unshift({ ...pos, exit, pnl, reason }); state.trades=state.trades.slice(0,40); const verb=reason==="tp"?"cible":reason==="sl"?"stop":reason==="temps"?"temps":"signal"; state.logs.unshift(pos.pair+" · sortie "+verb+" "+(pnl>=0?"+":"−")+Math.abs(pnl).toLocaleString("fr-FR",{maximumFractionDigits:2})+" USDT"); }
    function openPos(pair, candles, side){ const bar=candles.at(-1); const price=bar.c; const a=atr(candles).at(-1)||price*0.002; const slDist=Math.max(a*1.6, price*0.002); const eq=Math.max(1000, state.cash); let qty=(eq*state.risk)/slDist; qty=Math.min(qty,(eq*0.22)/price); if (!Number.isFinite(qty) || qty*price<20) return; const used=state.positions.reduce((a,p)=>a+p.qty*p.entry,0); if (used+qty*price>eq*0.75) return; state.cash -= price*qty*FEE; state.positions.push({ id:pair.id+"-"+state.tick, pair:pair.id, side, qty, entry:price, sl:side==="long"?price-slDist:price+slDist, tp:side==="long"?price+slDist*2.15:price-slDist*2.15, bars:0 }); state.logs.unshift(pair.id+" · "+side+" "+qty.toLocaleString("fr-FR",{maximumFractionDigits:3})+" @ "+px(price, pair.digits)); }
    function onBar(){ const kept=[]; for (const pos of state.positions){ const candles=state.books[pos.pair].candles; const bar=candles.at(-1); const held={...pos, bars:pos.bars+1}; const hitSl=held.side==="long"?bar.l<=held.sl:bar.h>=held.sl; const hitTp=held.side==="long"?bar.h>=held.tp:bar.l<=held.tp; if (hitSl||hitTp){ closePos(held, hitSl?held.sl:held.tp, hitSl?"sl":"tp"); continue; } const bias=signalAt(candles, state.strategy); if ((held.side==="long"&&bias==="short")||(held.side==="short"&&bias==="long")){ closePos(held, bar.c, "signal"); continue; } const raw=held.side==="long"?(bar.c-held.entry)*held.qty:(held.entry-bar.c)*held.qty; if (held.bars>=24 && raw<0){ closePos(held, bar.c, "temps"); continue; } kept.push(held); } state.positions=kept; if (!state.running || state.halted) return; for (const pair of PAIRS){ if (!state.enabled[pair.id]) continue; if (state.positions.some(p=>p.pair===pair.id)) continue; if (state.positions.length>=MAX) break; const candles=state.books[pair.id].candles; const bias=signalAt(candles, state.strategy); if (bias!=="flat") openPos(pair, candles, bias); } }
    function boot() {
      const full = {};
      for (const pair of PAIRS) {
        const built = build(pair, 168);
        full[pair.id] = built.candles;
        state.regime[pair.id] = built.regime;
        const last = built.candles.at(-1);
        state.books[pair.id] = { candles: built.candles, forming: { o: last.c, h: last.c, l: last.c, c: last.c, v: 0 } };
      }
      for (let i = 36; i < 168; i++) {
        for (const pair of PAIRS) {
          const slice = full[pair.id].slice(0, i + 1);
          const last = slice.at(-1);
          state.books[pair.id].candles = slice;
          state.books[pair.id].forming = { o: last.c, h: last.c, l: last.c, c: last.c, v: 0 };
        }
        onBar();
        state.curve.push(equity());
      }
      for (const pair of PAIRS) {
        const candles = full[pair.id];
        const last = candles.at(-1);
        state.books[pair.id] = { candles, forming: { o: last.c, h: last.c, l: last.c, c: last.c, v: 0 } };
      }
      if (!state.logs.length) state.logs.push("Cortex en ligne · univers actif · Pulse armé");
      state.logs = state.logs.slice(0, 24);
    }
    function commit(){ for (const pair of PAIRS){ const b=state.books[pair.id]; const done={...b.forming}; b.candles=[...b.candles, done].slice(-240); b.forming={ o:done.c, h:done.c, l:done.c, c:done.c, v:0 }; } onBar(); const eq=equity(); state.curve.push(eq); state.curve=state.curve.slice(-220); if (!state.halted && (eq-START)/START <= -0.015){ state.halted=true; state.running=false; const still=state.positions.slice(); state.positions=[]; for (const pos of still) closePos(pos, state.books[pos.pair].forming.c, "signal"); state.logs.unshift("Coupe-circuit · perte du jour −1,50 % · robot désarmé"); } }
    function tick() {
      state.tick++;
      for (const pair of PAIRS) {
        const rnd = mulberry32((pair.seed * 997 + state.tick * 13) >>> 0);
        const f = state.books[pair.id].forming;
        const stepped = stepPrice(f.c, state.regime[pair.id], pair.vol, rnd, 0.18);
        state.regime[pair.id] = stepped.regime;
        f.c = stepped.price;
        f.h = Math.max(f.h, f.c);
        f.l = Math.min(f.l, f.c);
        f.v += 6 + rnd() * 28;
      }
      if (state.tick % 8 === 0) commit();
      if (document.activeElement && document.activeElement.id === "risk") return;
      render();
    }
    function shot(id){ const book=state.books[id]; const candles=[...book.candles, book.forming]; const closes=candles.map(c=>c.c); const i=closes.length-1; const e9=ema(closes,9), e21=ema(closes,21); const r=rsi(closes)[i]; const a=atr(candles)[i]; const bias=signalAt(candles, state.strategy); const trend=a>0?clamp((e9[i]-e21[i])/a,-2,2):0; const confidence=Math.round(clamp(36+Math.abs(trend)*16+Math.abs((r-50)/18)*10+(bias==="flat"?8:28),8,93)); return { price:closes[i], rsi:r, atr:a, ema9:e9[i], ema21:e21[i], bias, confidence, change:(closes[i]-(closes[Math.max(0,i-60)]||closes[i]))/(closes[Math.max(0,i-60)]||closes[i]) }; }
    function area(values){ const w=640,h=180,min=Math.min(...values),max=Math.max(...values); const pts=values.map((v,i)=>[(i/(values.length-1))*w, 12+(1-(v-min)/(max-min||1))*(h-28)]); const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "); const up=values.at(-1)>=values[0]; const color=up?"#3dffc0":"#ff4d78"; return `<svg class="chart" viewBox="0 0 ${w} ${h}"><path d="${d} L${w},${h} L0,${h} Z" fill="${color}" opacity=".14"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/></svg>`; }
    function candlesSvg(id){ const rows=[...state.books[id].candles, state.books[id].forming].slice(-48); const w=640,h=220,volH=36; let lo=Infinity,hi=-Infinity,maxV=1; rows.forEach(c=>{ lo=Math.min(lo,c.l); hi=Math.max(hi,c.h); maxV=Math.max(maxV,c.v); }); const span=hi-lo||1; lo-=span*.08; hi+=span*.1; const plot=h-volH-8, slot=w/rows.length; const y=v=>((hi-v)/(hi-lo))*plot; return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="height:14rem">${rows.map((c,i)=>{ const up=c.c>=c.o; const x=i*slot+slot*.5; const body=Math.max(1.4,slot*.55); const top=y(Math.max(c.o,c.c)), bot=y(Math.min(c.o,c.c)); const color=up?"#3dffc0":"#ff4d78"; return `<line x1="${x}" x2="${x}" y1="${y(c.h)}" y2="${y(c.l)}" stroke="${color}"/><rect x="${x-body/2}" y="${top}" width="${body}" height="${Math.max(1,bot-top)}" fill="${color}"/>`; }).join("")}</svg>`; }
    function biasWord(b){ return b==="long"?"Long":b==="short"?"Short":"Attente"; }
    function nav(kind){ return VIEWS.map(([id,label])=>`<button class="${state.view===id?"on":""}" data-view="${id}">${label}</button>`).join(""); }
    function screen(){
      const eq=equity(); const pnl=eq-START; const s=shot(state.focus); const pair=PAIRS.find(p=>p.id===state.focus);
      const wins=state.trades.filter(t=>t.pnl>0); const grossW=wins.reduce((a,t)=>a+t.pnl,0); const grossL=Math.abs(state.trades.filter(t=>t.pnl<=0).reduce((a,t)=>a+t.pnl,0));
      const pf=grossL===0?(grossW>0?9.99:0):grossW/grossL; const wr=state.trades.length?wins.length/state.trades.length:0;
      let body="";
      if (state.view==="desk"){
        body=`<div class="grid kpis">${kpi("Résultat", money(pnl), pnl>=0?"jade":"rose")}${kpi("Réussite", pct(wr).replace("+",""))}${kpi("Profit factor", pf.toLocaleString("fr-FR",{maximumFractionDigits:2}))}${kpi("Positions", String(state.positions.length))}</div>
        <div class="grid split"><section class="card"><h2>Capital</h2>${area(state.curve.slice(-80))}</section><section class="card"><h2>Cortex</h2><div class="k">Biais ${pair.id}</div><div style="font-size:1.6rem;font-weight:600">${biasWord(s.bias)}</div><div class="gold mono" style="font-size:1.8rem">${s.confidence}</div><p class="note">${pair.name} · RSI ${s.rsi.toFixed(0)} · ${STRATS[state.strategy][0]}. ${state.running?"Le robot ouvre, tient et coupe seul.":"En veille. Les stops restent actifs."}</p><p class="faint" style="font-size:.8rem">${state.logs[0]||""}</p></section></div>
        <section class="card"><h2>Expositions</h2>${state.positions.length?state.positions.map(p=>{ const mkt=state.books[p.pair].forming.c; const u=(p.side==="long"?mkt-p.entry:p.entry-mkt)*p.qty; return `<div class="row"><div class="grow"><b>${p.pair}</b> <span class="${p.side==="long"?"jade":"rose"}">${p.side}</span><div class="mono faint" style="font-size:.75rem">${p.qty.toLocaleString("fr-FR",{maximumFractionDigits:3})} @ ${px(p.entry, PAIRS.find(x=>x.id===p.pair).digits)}</div></div><div class="right ${u>=0?"jade":"rose"} mono">${money(u)}</div></div>`; }).join(""):`<p class="note">Aucune exposition. Le cortex scanne le prochain régime.</p>`}</section>`;
      } else if (state.view==="marche"){
        body=`<div class="pills" style="margin-bottom:.7rem">${PAIRS.map(p=>`<button class="pill ${p.id===state.focus?"on":""}" data-focus="${p.id}">${p.id}</button>`).join("")}</div><section class="card"><h2>${pair.id} · ${px(s.price, pair.digits)} <span class="${s.change>=0?"jade":"rose"}">${pct(s.change)}</span></h2>${candlesSvg(pair.id)}<p class="note">${biasWord(s.bias)} · RSI ${s.rsi.toFixed(1)} · ATR ${px(s.atr, pair.digits)} · EMA 9 ${px(s.ema9, pair.digits)} / 21 ${px(s.ema21, pair.digits)}</p></section>`;
      } else if (state.view==="cortex"){
        body=`<section class="card"><h2>Lecture ${pair.name}</h2><div style="font-size:2rem;font-weight:600">${biasWord(s.bias)}</div><p class="note">Confiance ${s.confidence}. RSI ${s.rsi.toFixed(0)}, ${s.ema9>=s.ema21?"au-dessus":"sous"} l’EMA 21. ${STRATS[state.strategy][1]}</p><p class="note">Le moteur quantitatif décide à chaque bougie. Ce fichier n’appelle pas de modèle externe : l’exécution reste locale et automatique.</p></section><section class="card"><h2>Journal</h2>${state.logs.slice(0,12).map(l=>`<div class="log">${l}</div>`).join("")}</section>`;
      } else if (state.view==="robot"){
        body=`<section class="card"><h2>Doctrine</h2><div class="grid" style="grid-template-columns:1fr 1fr">${Object.entries(STRATS).map(([id,info])=>`<button class="pill ${state.strategy===id?"on":""}" data-strat="${id}" style="text-align:left;padding:.7rem"><b>${info[0]}</b><div class="faint" style="font-size:.75rem;margin-top:.3rem">${info[1]}</div></button>`).join("")}</div></section>
        <section class="card"><h2>Risque ${(state.risk*100).toLocaleString("fr-FR",{maximumFractionDigits:1})} %</h2><input id="risk" type="range" min="0.4" max="2" step="0.1" value="${(state.risk*100).toFixed(1)}" style="width:100%"><div class="pills" style="margin-top:.7rem">${PAIRS.map(p=>`<button class="pill ${state.enabled[p.id]?"on":""}" data-pair="${p.id}">${p.id}</button>`).join("")}</div><div class="row" style="margin-top:.8rem"><div class="grow"><b>${state.halted?"Coupe-circuit":state.running?"Robot armé":"Veille"}</b><div class="faint" style="font-size:.75rem">Stop 1,6 ATR · cible 2,15 R · 3 expositions</div></div><button class="arm ${state.running?"":"off"}" data-arm="1">${state.halted?"Réarmer":state.running?"Veille":"Armer"}</button></div></section>`;
      } else {
        body=`<div class="grid kpis">${kpi("Trades", String(state.trades.length))}${kpi("Profit factor", pf.toLocaleString("fr-FR",{maximumFractionDigits:2}))}${kpi("Réussite", pct(wr).replace("+",""))}${kpi("Session", pct(pnl/START), pnl>=0?"jade":"rose")}</div><section class="card"><h2>Livre</h2>${state.trades.slice(0,16).map(t=>`<div class="row"><div class="grow"><b>${t.pair}</b> <span class="faint">${t.reason}</span></div><div class="mono ${t.pnl>=0?"jade":"rose"}">${money(t.pnl)}</div></div>`).join("")||`<p class="note">Le livre se remplit au fil des sorties.</p>`}</section>`;
      }
      const tickers=PAIRS.map(p=>{ const c=state.books[p.id].forming.c; const prev=state.books[p.id].candles.at(-30)?.c||c; const ch=(c-prev)/prev; return `<button data-focus="${p.id}">${p.id} <span class="mono">${px(c,p.digits)}</span> <span class="${ch>=0?"jade":"rose"}">${pct(ch)}</span></button>`; }).join("");
      return `<div class="app"><nav class="rail"><div class="mark">AURION</div>${nav("rail")}</nav><div class="stage"><header class="top"><div><b>AURION</b> <span class="live"><span class="dot"></span>${state.halted?"Circuit":state.running?"En ligne":"Veille"}</span><div class="sub">${pair.id}/USDT · robot autonome · compte papier</div></div><div class="eq"><b class="${pnl>=0?"jade":"rose"}">${money(eq)}</b><div class="sub ${pnl>=0?"jade":"rose"}">${money(pnl)} · ${pct(pnl/START)}</div></div></header><div class="ticker">${tickers}</div><main>${body}</main></div><nav class="dock">${nav("dock")}</nav></div>`;
    }
    function kpi(k,v,tone){ return `<section class="card"><div class="k">${k}</div><div class="v ${tone||""}">${v}</div></section>`; }
    const root=document.getElementById("app");
    let scroll=0;
    function render(){ const main=root.querySelector("main"); if (main) scroll=main.scrollTop; root.innerHTML=screen(); const next=root.querySelector("main"); if (next) next.scrollTop=scroll; const risk=document.getElementById("risk"); if (risk) risk.addEventListener("input", ()=>{ state.risk=Number(risk.value)/100; }); }
    root.addEventListener("click", (e)=>{
      const n=e.target.closest("[data-view],[data-focus],[data-strat],[data-pair],[data-arm]");
      if (!n) return;
      if (n.dataset.view) state.view=n.dataset.view;
      if (n.dataset.focus){ state.focus=n.dataset.focus; if (state.view==="desk") state.view="marche"; }
      if (n.dataset.strat) state.strategy=n.dataset.strat;
      if (n.dataset.pair){ const id=n.dataset.pair; const on=Object.values(state.enabled).filter(Boolean).length; if (state.enabled[id] && on===1) return; state.enabled[id]=!state.enabled[id]; }
      if (n.dataset.arm){ if (state.halted && !state.running){ state.halted=false; state.running=true; } else state.running=!state.running; }
      render();
    });
    boot(); render(); setInterval(tick, 520);
  </script>
</body>
</html>
